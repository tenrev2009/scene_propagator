<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scene Propagator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1 id="title">Scene Propagator</h1>
  </header>

  <main>
    <section>
      <label for="source-scene" id="label-source">Source Scene</label>
      <select id="source-scene"></select>
    </section>

    <section>
      <label id="label-targets">Target Scenes</label>
      <input type="text" id="filter-scenes" placeholder="Filter scenes..." />
      <div class="scene-buttons">
        <button id="select-all">All</button>
        <button id="select-none">None</button>
        <button id="invert-selection">Invert</button>
      </div>
      <div id="scene-list" class="scrollbox"></div>
    </section>

    <section>
      <label id="label-scope">Copy Scope</label>
      <div id="checkboxes"></div>
    </section>

    <section>
      <label for="preset" id="label-preset">Preset</label>
      <select id="preset"></select>
      <button id="save-preset">💾</button>
    </section>

    <section class="actions">
      <button id="preview-btn">🔍 Preview</button>
      <button id="apply-btn">✅ Apply</button>
      <button id="cancel-btn">❌ Cancel</button>
    </section>

    <section class="manage">
      <h2 id="manage-title">Manage Scenes</h2>

      <div class="manage-block">
        <label id="label-rename">Rename a scene</label>
        <select id="rename-select"></select>
        <input type="text" id="rename-input" placeholder="New name..." />
        <button id="rename-btn">✏️ Rename</button>
      </div>

      <div class="manage-block">
        <label id="label-create">Create new scenes</label>
        <input type="text" id="create-base" placeholder="Base name (e.g. -)" />
        <div class="inline-fields">
          <input type="text" id="create-prefix" placeholder="Prefix" />
          <input type="text" id="create-suffix" placeholder="Suffix" />
          <input type="number" id="create-count" min="1" value="1" title="How many" />
          <input type="number" id="create-start-index" min="1" value="1" title="Start index" />
        </div>
        <label id="label-insert-after">Insert after</label>
        <select id="create-insert-after"></select>
        <div id="create-preview" class="preview-text"></div>
        <label class="checkbox-label">
          <input type="checkbox" id="create-copy-source" />
          <span id="label-copy-source">Copy properties from a source scene</span>
        </label>
        <select id="create-source-select" disabled></select>
        <button id="create-btn">➕ Create scenes</button>
      </div>

      <div class="manage-block">
        <label id="label-bulk-rename">Rename selected scenes (checked above)</label>
        <input type="text" id="bulk-base" placeholder="Base name (e.g. -)" />
        <div class="inline-fields">
          <input type="text" id="bulk-prefix" placeholder="Prefix" />
          <input type="text" id="bulk-suffix" placeholder="Suffix" />
          <input type="number" id="bulk-start-index" min="1" value="1" title="Start index" />
        </div>
        <div id="bulk-preview" class="preview-text"></div>
        <button id="bulk-rename-btn">🔁 Rename selection</button>
      </div>

      <div class="manage-block">
        <label id="label-csv">Export / Import scene names (CSV)</label>
        <div class="inline-fields">
          <button id="export-names-btn">📤 Export CSV</button>
          <input type="file" id="import-names-file" accept=".csv" />
        </div>
        <button id="import-names-btn">📥 Import CSV</button>
      </div>
    </section>

    <section>
      <h2 id="log-title">Execution Log</h2>
      <div id="log-output" class="log-panel scrollbox"></div>
      <label for="log-format">Export</label>
      <select id="log-format">
        <option value="json">JSON</option>
        <option value="csv">CSV</option>
      </select>
      <button id="export-log">📤</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
